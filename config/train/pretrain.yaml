model:
  torch_dtype: ::torch.bfloat16
  use_flash_attention_2: true
train:
  peft: false
training_args:
  per_device_eval_batch_size: 16
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  bf16: true
  report_to: null
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  warmup_steps: 0
  learning_rate: 1.0e-3
  weight_decay: 0.05
trainer_args:
  packing: true
  max_seq_length: 1024
datasets:
  seq_length: 1024
  train_datasets:
    - split: "train"
      shuffle: true
      name: "data/pretrain.jsonl"
      infinite: true
      from: 1000
  eval_datasets:
    - split: "train"
      shuffle: true
      name: "data/pretrain.jsonl"
      infinite: false
      to: 1000
