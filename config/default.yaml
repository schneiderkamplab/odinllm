bnb_config:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: ::torch.bfloat16
gptq_config:
  bits: 4
  group_size: 32
  desc_act: false
peft_config:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: []
  bias: none
  task_type: CAUSAL_LM
model:
  trust_remote_code: true
  torch_dtype: ::torch.bfloat16
#  attn_implementation: "flash_attention_2"
  use_flash_attention_2: true
#  use_cache: false
  revision: main
  load_in_4bit: false
  load_in_8bit: false
  device_map: auto
tokenizer:
  use_fast: true
  padding_side: right
  trust_remote_code: true
model_config:
  rms_norm_eps: 1.0e-05
  torch_dtype: ::torch.bfloat16
  hidden_size: null
  max_position_embeddings: null
  num_attention_heads: null
  num_hidden_layers: null
  num_key_value_heads: null
  vocab_size: null
init:
  config_class: ::transformers.MistralConfig
  model_class: ::transformers.MistralForCausalLM
  torch_dtype: ::torch.bfloat16
  tokenizer_class: ::transformers.LlamaTokenizerFast
  tokenizer_template: mistralai/Mistral-7B-v0.1
  tokenizer_min_frequency: 0
  corpora: []
training_args:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 32
  bf16: true
  remove_unused_columns: true
  max_steps: -1
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  save_total_limit: 1
  load_best_model_at_end: true
  metric_for_best_model: null
  greater_is_better: false
  evaluation_strategy: steps
  do_eval: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  group_by_length: false
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 100
  weight_decay: 0.05
  optim: paged_adamw_32bit
  remove_unused_columns: true
  run_name: null
  report_to: wandb
  seed: 42
  ddp_find_unused_parameters: true
  output_dir: null
datasets:
  num_proc: 24
  shuffle_buffer: 5000
  seq_length: 1024
  test_size: 100
  shuffle: true
  seed: 42
  train_datasets: []
  eval_datasets: []
  quantize_datasets: []
trainer_args:
  packing: true
  max_seq_length: 1024
  dataset_text_field: text
  neftune_noise_alpha: null
train:
  peft: true
  early_stopping_patience: -1
  layers: model.layers
  every: null
  experts: block_sparse_moe.experts
  train_experts: null
infer:
  run_prompt: []
  max_new_tokens: 128
edit:
  every: null
  layers: model.layers
  zero:
    - self_attn.o_proj
    - mlp.down_proj
  add_experts: null
  gate: block_sparse_moe.gate
  experts: block_sparse_moe.experts
  embeddings: model.embed_tokens
  lm_head: lm_head
snapshot:
  file_name: []
