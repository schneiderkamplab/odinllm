init:
  config_class: ::transformers.LlamaConfig
  model_class: ::transformers.LlamaForCausalLM
  torch_dtype: ::torch.float32
  tokenizer_class: ::transformers.LlamaTokenizerFast
  tokenizer_template: mistralai/Mistral-7B-v0.1
model_config:
  torch_dtype: ::torch.float32
  hidden_size: 64
  intermediate_size: 224
  max_position_embeddings: 64
  num_attention_heads: 2
  num_hidden_layers: 2
  num_key_value-heads: 2
  vocab_size: 1000
