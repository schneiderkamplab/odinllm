stages:
  - stage0
  - stage1
  - stage2

.odinllmTemplate:
  image: git.ordbogen.com:5050/odin/odinllm/odinllm
  when: on_success
  allow_failure: false
  tags:
    - odin
  before_script:
    - source /root/.bashrc
    - conda activate env

.stage0Template:
  extends: .odinllmTemplate
  stage: stage0

init:
  extends: .stage0Template
  script:
    - python -m odinllm init config/default.yaml config/tiny.yaml models/test --corpora data/ft-1000.jsonl
  artifacts:
    paths:
      - models/test

snapshot:
  extends: .stage0Template
  script:
    - python -m odinllm snapshot config/default.yaml peter-sk/gpt-neox-da-tiny --target-dir models/neox
  artifacts:
    paths:
      - models/neox

.stage1Template:
  extends: .odinllmTemplate
  stage: stage1

eval:
  extends: .stage1Template
  script:
    - python -m odinllm eval config/default.yaml config/eval_sft-1000.yaml models/test
    - python -m odinllm eval config/default.yaml config/eval_sft-1000.yaml models/neox
  needs:
    - init
    - snapshot

sft:
  extends: .stage1Template
  script:
    - CUDA_VISIBLE_DEVICES=0 python -m odinllm train config/default.yaml config/train_sft-1000.yaml models/test models/test-sft
  needs:
    - init
  artifacts:
    paths:
      - models/test-sft

pretrain:
  extends: .stage1Template
  script:
    - CUDA_VISIBLE_DEVICES=0 python -m odinllm train config/default.yaml config/train_pretrain-1000.yaml models/test models/test-pretrain
  needs:
    - init
  artifacts:
    paths:
      - models/test-pretrain

quantize:
  extends: .stage1Template
  script:
    - python -m odinllm quantize config/default.yaml config/train_sft-1000.yaml models/test models/test-gptq
  needs:
    - init
  artifacts:
    paths:
      - models/test-gptq

.stage2Template:
  extends: .odinllmTemplate
  stage: stage2

finalize:
  extends: .stage2Template
  script:
    - python -m odinllm finalize config/default.yaml models/test-sft --base-model models/test
  needs:
    - init
    - sft

infer:
  extends: .stage2Template
  script:
    - CUDA_VISIBLE_DEVICES=0 python -m odinllm infer config/default.yaml config/train_sft-1000.yaml models/test --lora-adapter models/test-sft
    - CUDA_VISIBLE_DEVICES=0 python -m odinllm infer config/default.yaml config/train_sft-1000.yaml models/neox
  needs:
    - init
    - sft
    - snapshot

merge:
  extends: .stage2Template
  script:
    - python -m odinllm merge config/default.yaml models/test models/test-sft models/test-merged
  needs:
    - init
    - sft
  artifacts:
    paths:
      - models/test-merged

